name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - staging
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

  push:
    branches:
      - develop
      - staging
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  frontend:
    name: Frontend lint, format and build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: dummy-anon-key

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run format check
        run: npm run format:check

      - name: Build frontend
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL"
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY"
          echo "Supabase env vars are set"
          npm run build

      # TODO: Playwright E2E tests will be enabled after CI environment is prepared.
      # Current E2E tests require:
      # - frontend server on localhost:3000
      # - backend server
      # - E2E test user credentials
      #
      # Required secrets:
      # - E2E_GENERAL_USER_EMAIL
      # - E2E_GENERAL_USER_PASSWORD
      # - E2E_PREMIUM_USER_EMAIL
      # - E2E_PREMIUM_USER_PASSWORD
